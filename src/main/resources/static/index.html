<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do App</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 2rem 1rem; color: #222; }
        .app { max-width: 640px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        h1 { margin-top: 0; }
        .stats { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .stat { flex: 1; min-width: 80px; background: #f0f2f5; border-radius: 8px; padding: .5rem; text-align: center; font-size: .85rem; }
        .stat b { display: block; font-size: 1.3rem; }
        .stat.overdue b { color: #d93025; }
        form { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
        .row { display: flex; gap: .5rem; }
        input, select, button { font: inherit; padding: .5rem; border: 1px solid #ccc; border-radius: 6px; }
        input[type=text], input:not([type]) { flex: 1; }
        button { background: #1a73e8; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #1557b0; }
        #error { color: #d93025; font-size: .85rem; }
        .filters { display: flex; gap: .5rem; margin-bottom: 1rem; }
        .filters input { flex: 1; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; align-items: flex-start; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid #eee; }
        li .body { flex: 1; }
        li .title { font-weight: 600; }
        li .desc, li .due { font-size: .85rem; color: #666; }
        li.done .title { text-decoration: line-through; color: #999; }
        .due.overdue { color: #d93025; font-weight: 600; }
        .badge { font-size: .7rem; padding: .1rem .5rem; border-radius: 10px; margin-left: .4rem; color: #fff; }
        .badge.HIGH { background: #d93025; }
        .badge.MEDIUM { background: #f29900; }
        .badge.LOW { background: #188038; }
        .del { background: transparent; color: #999; padding: .2rem .5rem; }
        .del:hover { background: #fce8e6; color: #d93025; }
        .empty { text-align: center; color: #999; padding: 1.5rem 0; }
    </style>
</head>
<body>
<div class="app">
    <h1>To-Do</h1>

    <div class="stats" id="stats"></div>

    <form id="form">
        <input id="title" placeholder="What needs doing?" maxlength="200" required>
        <input id="description" placeholder="Description (optional)" maxlength="1000">
        <div class="row">
            <select id="priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>
            <input type="date" id="dueDate">
            <button type="submit">Add</button>
        </div>
        <div id="error"></div>
    </form>

    <div class="filters">
        <input id="q" placeholder="Search...">
        <select id="fStatus">
            <option value="">All</option>
            <option value="false">Pending</option>
            <option value="true">Completed</option>
        </select>
        <select id="fPriority">
            <option value="">Any priority</option>
            <option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option>
            <option value="LOW">Low</option>
        </select>
    </div>

    <ul id="list"></ul>
</div>

<script>
    const api = '/api/todos';
    const $ = id => document.getElementById(id);

    async function load() {
        const params = new URLSearchParams({ size: 100, sort: 'createdAt,desc' });
        if ($('q').value.trim()) params.set('q', $('q').value.trim());
        if ($('fStatus').value) params.set('completed', $('fStatus').value);
        if ($('fPriority').value) params.set('priority', $('fPriority').value);

        const res = await fetch(api + '?' + params);
        const page = await res.json();
        render(page.content);
        loadStats();
    }

    async function loadStats() {
        const s = await (await fetch(api + '/stats')).json();
        $('stats').innerHTML = '';
        [['Total', s.total, ''], ['Pending', s.pending, ''],
            ['Done', s.completed, ''], ['Overdue', s.overdue, 'overdue']].forEach(([label, n, cls]) => {
            const d = document.createElement('div');
            d.className = 'stat ' + cls;
            const b = document.createElement('b');
            b.textContent = n;
            d.append(b, label);
            $('stats').appendChild(d);
        });
    }

    function render(todos) {
        const list = $('list');
        list.innerHTML = '';
        if (todos.length === 0) {
            const li = document.createElement('li');
            li.className = 'empty';
            li.textContent = 'Nothing here yet.';
            list.appendChild(li);
            return;
        }
        const today = new Date().toLocaleDateString('en-CA'); // yyyy-MM-dd

        todos.forEach(t => {
            const li = document.createElement('li');
            if (t.completed) li.className = 'done';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = t.completed;
            cb.onchange = async () => { await fetch(api + '/' + t.id + '/toggle', { method: 'PATCH' }); load(); };

            const body = document.createElement('div');
            body.className = 'body';

            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = t.title;
            const badge = document.createElement('span');
            badge.className = 'badge ' + t.priority;
            badge.textContent = t.priority;
            title.appendChild(badge);
            body.appendChild(title);

            if (t.description) {
                const desc = document.createElement('div');
                desc.className = 'desc';
                desc.textContent = t.description;
                body.appendChild(desc);
            }
            if (t.dueDate) {
                const due = document.createElement('div');
                const overdue = !t.completed && t.dueDate < today;
                due.className = 'due' + (overdue ? ' overdue' : '');
                due.textContent = (overdue ? 'Overdue: ' : 'Due: ') + t.dueDate;
                body.appendChild(due);
            }

            const del = document.createElement('button');
            del.className = 'del';
            del.textContent = '✕';
            del.title = 'Delete';
            del.onclick = async () => {
                if (confirm('Delete "' + t.title + '"?')) {
                    await fetch(api + '/' + t.id, { method: 'DELETE' });
                    load();
                }
            };

            li.append(cb, body, del);
            list.appendChild(li);
        });
    }

    $('form').onsubmit = async e => {
        e.preventDefault();
        $('error').textContent = '';
        const res = await fetch(api, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: $('title').value,
                description: $('description').value || null,
                priority: $('priority').value,
                dueDate: $('dueDate').value || null
            })
        });
        if (!res.ok) {
            const err = await res.json();
            $('error').textContent = err.errors ? Object.values(err.errors).join(', ') : err.detail;
            return;
        }
        $('form').reset();
        load();
    };

    let timer;
    $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 300); };
    $('fStatus').onchange = load;
    $('fPriority').onchange = load;

    load();
</script>
</body>
</html>
